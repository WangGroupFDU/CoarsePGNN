[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coarsepgnn-release"
version = "1.0.1"
description = "Reaction-aware coarse polymer graphs and five-fold polymer property prediction"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Jifeng Wang"}]

[project.scripts]
coarsepgnn = "coarsepgnn_release.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coarsepgnn = ["sample_schema.json", "package_manifest.json"]
coarsepgnn_release = ["assets.json"]
